name: Site CI

on:
  pull_request:
    paths:
      - ".dagger/**"
      - ".github/scripts/setup-dagger.sh"
      - ".github/workflows/deploy-site.yml"
      - ".github/workflows/site-ci.yml"
      - "dagger.json"
      - "dagger_contract_test.go"
      - "site/**"

permissions:
  contents: read

concurrency:
  group: paje-site-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: >-
      ${{
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        'ubuntu-latest'
      }}
    env:
      CACHE_SCOPE: untrusted
      RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require exact Dagger CLI
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_OS: ${{ runner.os }}
        run: bash .github/scripts/setup-dagger.sh

      - name: Audit dependencies freshly
        run: dagger call site-audit --source=. --run-nonce="$RUN_NONCE"

      - name: Build, lint, and test site
        run: >-
          dagger call site-build
          --source=.
          --cache-scope="$CACHE_SCOPE"
          export --path="${{ runner.temp }}/paje-site-dist"

      - name: Upload static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: paje-site-dist
          path: ${{ runner.temp }}/paje-site-dist
          if-no-files-found: error
