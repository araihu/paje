name: Deploy site

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-site.yml"
      - "site/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-site.yml"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paje-site-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static site
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps"]') ||
        'ubuntu-latest'
      }}
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: site/generator/go.mod
          cache-dependency-path: site/generator/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test generated site
        run: npm test

      - name: Upload static site
        uses: actions/upload-artifact@v7
        with:
          name: paje-site-dist
          path: site/dist
          if-no-files-found: error

  deploy:
    name: Deploy Cloudflare Worker
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps"]') ||
        'ubuntu-latest'
      }}
    environment:
      name: production
      url: https://paje.araihu.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Download validated site
        uses: actions/download-artifact@v8
        with:
          name: paje-site-dist
          path: site/dist

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN Actions secret" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID Actions variable" >&2; exit 1; }

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: "4.92.0"
          command: deploy
