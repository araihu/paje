name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - ".dagger/**"
      - ".github/scripts/setup-dagger.sh"
      - ".github/workflows/deploy-site.yml"
      - "dagger.json"
      - "dagger_contract_test.go"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paje-site-production
  cancel-in-progress: false

env:
  CACHE_SCOPE: ${{ github.event_name == 'push' && 'main' || 'manual' }}
  RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require exact Dagger CLI
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_OS: ${{ runner.os }}
        run: bash .github/scripts/setup-dagger.sh

      - name: Audit dependencies freshly
        run: dagger call site-audit --source=. --run-nonce="$RUN_NONCE"

      - name: Build, lint, and test site
        run: >-
          dagger call site-build
          --source=.
          --cache-scope="$CACHE_SCOPE"
          export --path="${{ runner.temp }}/paje-site-dist"

      - name: Upload static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: paje-site-dist
          path: ${{ runner.temp }}/paje-site-dist
          if-no-files-found: error

  deploy:
    name: Deploy Cloudflare Worker
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://paje.araihu.com
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paje-site-dist
          path: ${{ runner.temp }}/paje-site-dist

      - name: Require exact Dagger CLI
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_OS: ${{ runner.os }}
        run: bash .github/scripts/setup-dagger.sh

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN Actions secret" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID Actions variable" >&2; exit 1; }

      - name: Deploy validated site with Dagger
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          dagger call deploy-site
          --source=.
          --dist="${{ runner.temp }}/paje-site-dist"
          --cloudflare-api-token=env://CLOUDFLARE_API_TOKEN
          --cloudflare-account-id="$CLOUDFLARE_ACCOUNT_ID"
          --run-nonce="$RUN_NONCE"
