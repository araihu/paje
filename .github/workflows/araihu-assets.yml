name: Update Arai Hu fallback assets
on:
  repository_dispatch:
    types: [araihu-assets-released]
  workflow_dispatch:
    inputs:
      assets_repository: {required: true, default: araihu/assets, type: string}
      assets_revision: {required: true, type: string}
      release: {required: true, type: string}
      release_url: {required: true, type: string}
      release_sha256: {required: true, type: string}
      release_json_sha256: {required: true, type: string}
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Read and validate exact provenance payload
        id: event
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EVENT_NAME: ${{ github.event_name }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re

          values = json.loads(os.environ["PAYLOAD"] if os.environ["EVENT_NAME"] == "repository_dispatch" else os.environ["INPUTS"])
          keys = {"assets_repository", "assets_revision", "release", "release_url", "release_sha256", "release_json_sha256"}
          if not isinstance(values, dict) or set(values) != keys:
              raise SystemExit("payload must contain exactly six provenance keys")
          if not all(isinstance(values[key], str) for key in keys):
              raise SystemExit("all provenance values must be strings")
          if values["assets_repository"] != "araihu/assets":
              raise SystemExit("assets repository must be araihu/assets")
          if re.fullmatch(r"[0-9a-f]{40}", values["assets_revision"]) is None:
              raise SystemExit("assets revision must be a full commit SHA")
          if re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", values["release"]) is None:
              raise SystemExit("release must be a stable SemVer tag")
          expected_url = f"https://github.com/araihu/assets/releases/download/{values['release']}/araihu-assets-{values['release']}.tar.gz"
          if values["release_url"] != expected_url:
              raise SystemExit("release URL differs from immutable archive URL")
          for key in ("release_sha256", "release_json_sha256"):
              if re.fullmatch(r"[0-9a-f]{64}", values[key]) is None:
                  raise SystemExit(f"{key} must be a SHA-256 digest")
          for key in sorted(keys):
              print(f"{key}={values[key]}")
          PY
      - name: Verify tag resolves to dispatched revision
        env:
          ASSETS_REVISION: ${{ steps.event.outputs.assets_revision }}
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.event.outputs.release }}
        run: |
          set -euo pipefail
          object=$(gh api "repos/araihu/assets/git/ref/tags/${RELEASE}" --jq '.object.type + " " + .object.sha')
          read -r object_type object_sha <<< "$object"
          if test "$object_type" = tag; then
            object=$(gh api "repos/araihu/assets/git/tags/${object_sha}" --jq '.object.type + " " + .object.sha')
            read -r object_type object_sha <<< "$object"
          fi
          test "$object_type" = commit
          test "$object_sha" = "$ASSETS_REVISION"
      - name: Create selected-repository App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
          private-key: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: paje
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
      - name: Check out Pajé
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      - name: Download immutable release once
        run: curl --fail --location --proto '=https' --tlsv1.2 '${{ steps.event.outputs.release_url }}' --output /tmp/araihu-assets.tar.gz
      - name: Apply and regenerate
        run: |
          go run ./cmd/araihu-assets-update -repo . -archive /tmp/araihu-assets.tar.gz \
            -assets-repository '${{ steps.event.outputs.assets_repository }}' \
            -assets-revision '${{ steps.event.outputs.assets_revision }}' \
            -release '${{ steps.event.outputs.release }}' \
            -release-url '${{ steps.event.outputs.release_url }}' \
            -release-sha256 '${{ steps.event.outputs.release_sha256 }}' \
            -release-json-sha256 '${{ steps.event.outputs.release_json_sha256 }}'
          cd site/generator && GOTOOLCHAIN=auto go run . --out ../public
          git diff --check
      - name: Create versioned pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE: ${{ steps.event.outputs.release }}
        run: |
          git diff --quiet && exit 0
          branch="automation/araihu-assets-${RELEASE}"
          git switch -c "$branch"
          git add araihu-assets.json site/generator/araihu.css site/public
          git config user.name "araihu-assets-release-bot[bot]"
          git config user.email "araihu-assets-release-bot[bot]@users.noreply.github.com"
          git commit -m "chore(assets): update fallbacks for ${RELEASE}"
          git push origin "$branch"
          pr=$(gh pr create --base main --head "$branch" --title "chore(assets): update fallbacks for ${RELEASE}" --body "Verified immutable Arai Hu Assets fallback update.")
          for label in assets automation dependencies; do
            if gh label list --limit 100 --json name --jq '.[].name' | grep -Fx "$label" >/dev/null; then
              gh pr edit "$pr" --add-label "$label" || echo "warning: could not add optional label $label"
            fi
          done
