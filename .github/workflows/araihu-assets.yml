name: Update Arai Hu fallback assets
on:
  repository_dispatch:
    types: [araihu-assets-released]
  workflow_dispatch:
    inputs:
      assets_repository: {required: true, default: araihu/assets, type: string}
      assets_revision: {required: true, type: string}
      release: {required: true, type: string}
      release_url: {required: true, type: string}
      release_sha256: {required: true, type: string}
      release_json_sha256: {required: true, type: string}
permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable Assets handoff
    runs-on: ubuntu-24.04
    env:
      RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out Pajé read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Materialize exact provenance payload
        env:
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          mkdir -p .dagger-inputs
          if [[ "$EVENT_NAME" == repository_dispatch ]]; then
            printf '%s' "$DISPATCH_PAYLOAD" > .dagger-inputs/assets.json
          else
            printf '%s' "$MANUAL_INPUTS" > .dagger-inputs/assets.json
          fi

      - name: Require exact Dagger CLI
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_OS: ${{ runner.os }}
        run: bash .github/scripts/setup-dagger.sh

      - name: Validate payload, resolve tag read-only, and regenerate fallbacks
        env:
          ASSETS_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dagger call update-araihu-assets
          --source=.
          --payload=.dagger-inputs/assets.json
          --github-token=env://ASSETS_GITHUB_TOKEN
          --cache-scope=assets
          --run-nonce="$RUN_NONCE"
          export --path="${{ runner.temp }}/paje-assets-validated"

      - name: Upload validated allowlisted handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: paje-assets-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paje-assets-validated
          if-no-files-found: error

  publish:
    name: Publish validated fallback update
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Create selected-repository App token after validation
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
          private-key: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: paje
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - name: Check out Pajé for the validated write
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Download validated allowlisted handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paje-assets-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paje-assets-validated

      - name: Materialize validated fallback update
        env:
          VALIDATED_ROOT: ${{ runner.temp }}/paje-assets-validated
        run: |
          set -euo pipefail
          handoff="$VALIDATED_ROOT/assets-handoff.json"
          jq -e 'type == "object" and keys == ["assets_repository","assets_revision","release","release_json_sha256","release_sha256","release_url"]' "$handoff" >/dev/null
          release=$(jq -er '.release | select(test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' "$handoff")
          install -Dm0644 "$VALIDATED_ROOT/araihu-assets.json" araihu-assets.json
          install -Dm0644 "$VALIDATED_ROOT/site/generator/araihu.css" site/generator/araihu.css
          rsync -a --delete "$VALIDATED_ROOT/site/public/" site/public/
          printf 'RELEASE=%s\n' "$release" >> "$GITHUB_ENV"

      - name: Create versioned pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git diff --quiet && exit 0
          branch="automation/araihu-assets-${RELEASE}"
          git switch -c "$branch"
          git add araihu-assets.json site/generator/araihu.css site/public
          git config user.name "araihu-assets-release-bot[bot]"
          git config user.email "araihu-assets-release-bot[bot]@users.noreply.github.com"
          git commit -m "chore(assets): update fallbacks for ${RELEASE}"
          git push origin "$branch"
          pr=$(gh pr create --base main --head "$branch" --title "chore(assets): update fallbacks for ${RELEASE}" --body "Verified immutable Arai Hu Assets fallback update.")
          for label in assets automation dependencies; do
            if gh label list --limit 100 --json name --jq '.[].name' | grep -Fx "$label" >/dev/null; then
              gh pr edit "$pr" --add-label "$label" || echo "warning: could not add optional label $label"
            fi
          done
