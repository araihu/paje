apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "paje.fullname" . }}
  labels:
    {{- include "paje.labels" . | nindent 4 }}
data:
  PAJE_MEMORY_ADAPTER: {{ .Values.adapters.memory | quote }}
  PAJE_WORKSPACE_ADAPTER: {{ .Values.adapters.workspace | quote }}
  PAJE_RUNNER_ADAPTER: {{ .Values.adapters.runner | quote }}
  PAJE_PUBLISHER_ADAPTER: {{ .Values.publisher.adapter | quote }}
  {{- if .Values.persistence.enabled }}
  PAJE_WORKSPACE_ROOT: "/var/lib/paje/workspace"
  PAJE_RUN_ROOT: "/var/lib/paje/runs"
  PAJE_ARTIFACT_ROOT: "/var/lib/paje/artifacts"
  {{- else }}
  PAJE_WORKSPACE_ROOT: {{ .Values.workspace.root | quote }}
  PAJE_RUN_ROOT: {{ printf "%s/runs" (trimSuffix "/" .Values.workspace.root) | quote }}
  PAJE_ARTIFACT_ROOT: {{ printf "%s/artifacts" (trimSuffix "/" .Values.workspace.root) | quote }}
  {{- end }}
  PAJE_RUNTIME_ROOT: "/run/paje"
  PAJE_ARTIFACT_LIMIT_BYTES: {{ .Values.limits.artifactBytes | int64 | quote }}
  PAJE_COMMAND_OUTPUT_LIMIT_BYTES: {{ .Values.limits.commandOutputBytes | int64 | quote }}
  PAJE_ENV_ALLOWLIST: {{ .Values.environment.allowlist | toJson | quote }}
  PAJE_RUNNER_COMMAND: {{ .Values.runner.command | quote }}
  PAJE_RUNNER_ARGS: {{ .Values.runner.args | toJson | quote }}
  GITHUB_API_URL: {{ .Values.publisher.githubAPIURL | quote }}
  HOME: "/tmp"
  HATCHET_CLIENT_LOG_LEVEL: {{ .Values.hatchet.logLevel | quote }}
  {{- with .Values.mem0.baseURL }}
  MEM0_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.hatchet.hostPort }}
  HATCHET_CLIENT_HOST_PORT: {{ . | quote }}
  {{- end }}
  {{- with .Values.hatchet.serverURL }}
  HATCHET_CLIENT_SERVER_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.hatchet.namespace }}
  HATCHET_CLIENT_NAMESPACE: {{ . | quote }}
  {{- end }}
  {{- with .Values.hatchet.tlsStrategy }}
  HATCHET_CLIENT_TLS_STRATEGY: {{ . | quote }}
  {{- end }}
