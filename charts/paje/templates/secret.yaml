{{- if not .Values.secrets.hatchet.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-hatchet" (include "paje.fullname" .) }}
  labels:
    {{- include "paje.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.hatchet.key }}: {{ required "secrets.hatchet.value or secrets.hatchet.existingSecret is required" .Values.secrets.hatchet.value | quote }}
{{- end }}
{{- if and (eq .Values.adapters.memory "mem0") (not .Values.secrets.mem0.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-mem0" (include "paje.fullname" .) }}
  labels:
    {{- include "paje.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.mem0.key }}: {{ required "secrets.mem0.value or secrets.mem0.existingSecret is required when adapters.memory=mem0" .Values.secrets.mem0.value | quote }}
{{- end }}
{{- if and (eq .Values.publisher.adapter "github") (not .Values.secrets.github.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-github" (include "paje.fullname" .) }}
  labels:
    {{- include "paje.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.github.key }}: {{ required "secrets.github.value or secrets.github.existingSecret is required when publisher.adapter=github" .Values.secrets.github.value | quote }}
{{- end }}
