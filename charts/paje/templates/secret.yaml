{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paje.fullname" . }}
  labels:
    {{- include "paje.labels" . | nindent 4 }}
type: Opaque
stringData:
  hatchet-client-token: {{ required "secrets.hatchetClientToken or secrets.existingSecret is required" .Values.secrets.hatchetClientToken | quote }}
  {{- if eq .Values.adapters.memory "mem0" }}
  mem0-api-key: {{ required "secrets.mem0ApiKey or secrets.existingSecret is required when adapters.memory=mem0" .Values.secrets.mem0ApiKey | quote }}
  {{- else }}
  {{- with .Values.secrets.mem0ApiKey }}
  mem0-api-key: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
